# Paths are resolved relative to the project root unless absolute.

[generation]
days = 60.0     # simulated mission duration [days]; > 2.0 required for MBHB injection
fs = 0.2        # sampling frequency [Hz]
n_mbhb = 15     # number of injected MBHB events; >= 0
n_gbs = 150     # number of background galactic binaries; >= 0
n_emris = 15    # number of background EMRIs; >= 0
seed = 9999     # RNG seed for the simulation
output = "data/inputs/simulated_telemetry_complex.h5"   # output HDF5 path

[preprocessing]
window_size = 1000   # sliding-window length [samples]
step_size = 100      # sliding-window step [samples]; <= window_size
sample_rate = 0.2    # sampling frequency of the input telemetry [Hz]
output_prefix = "telemetry_complex"   # prefix of the output feature/label CSVs

[training]
train_features = "data/inputs/telemetry_complex_features.csv"   # training feature CSV
train_labels = "data/inputs/telemetry_complex_labels.csv"       # training label CSV
epochs = 50       # maximum training epochs; >= 1
batch_size = 64   # mini-batch size; >= 1
seed = 9999       # RNG seed for the data split and initialization

[inference]
features = "data/inputs/telemetry_complex_features.csv"   # inference feature CSV
labels = "data/inputs/telemetry_complex_labels.csv"       # inference label CSV; "" for blind mode
step_size = 100      # window step used during preprocessing [samples]
sample_rate = 0.2    # sampling frequency of the original telemetry [Hz]
target_fpr = 0.05    # maximum false-positive rate for threshold selection; 0.0 selects Youden's J


