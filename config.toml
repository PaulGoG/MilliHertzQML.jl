# Paths are resolved relative to the project root unless absolute.

[paths]
inputs = "data/inputs"              # generated telemetry and feature CSVs
models = "models"                   # per-run model checkpoints, logs, thresholds
plots = "data/outputs/plots"        # per-run figures
results = "data/outputs/results"    # per-run inference tables and snapshots

[generation]
days = 60.0     # simulated mission duration [days]; > 0
fs = 0.2        # sampling frequency [Hz]
n_mbhb = 15     # number of injected MBHB events; >= 0
n_gbs = 150     # number of background galactic binaries; >= 0
n_emris = 15    # number of background EMRIs; >= 0
seed = 9999     # RNG seed for the simulation
output = "data/inputs/simulated_telemetry_complex.h5"   # output HDF5 path
observation_years = 1.0     # confusion-foreground fit of Robson et al. (2019); one of: 0.5 | 1.0 | 2.0 | 4.0
snr_min = 8.0               # MBHB matched-filter SNR, lower bound; > 0
snr_max = 50.0              # MBHB matched-filter SNR, upper bound; >= snr_min
gb_snr_min = 1.0            # galactic-binary matched-filter SNR over the record, lower bound; > 0
gb_snr_max = 10.0           # galactic-binary matched-filter SNR over the record, upper bound; >= gb_snr_min
emri_snr_min = 2.0          # EMRI matched-filter SNR over the record, lower bound; > 0
emri_snr_max = 10.0         # EMRI matched-filter SNR over the record, upper bound; >= emri_snr_min
label_span = "detectable"   # positive-label span; one of: "detectable" | "injection" | "fixed"
label_snr_threshold = 5.0   # per-window matched-filter SNR defining "detectable"; > 0
label_window_size = 1000    # window length of the detectability criterion [samples]; >= 2
label_step = 10             # stride of the detectability scan [samples]; >= 1
label_before_sec = 43200.0  # fixed span before coalescence [s]; >= 0; used when label_span = "fixed"
label_after_sec = 3600.0    # fixed span after coalescence [s]; >= 0; used when label_span = "fixed"
mbhb_duration_days = 2.0    # injected inspiral duration [days], capped at 0.4 of the record; > 0
noise_f_min_hz = 1e-5       # lowest synthesized noise frequency [Hz]; >= 0
mbhb_total_mass_min = 1e5   # detector-frame total mass, lower bound [M_sun]; >= 1
mbhb_total_mass_max = 1e7   # detector-frame total mass, upper bound [M_sun]; >= mbhb_total_mass_min
mbhb_mass_ratio_max = 10.0  # mass ratio q = m1/m2 upper bound; >= 1
nyquist_taper = 0.9         # waveform spectrum tapered to zero at this fraction of the Nyquist frequency; in [0.3, 1]

[preprocessing]
tdi_group = "obs/tdi"   # HDF5 group or compound dataset holding t, X, Y, Z
window_size = 1000   # sliding-window length [samples]; >= 2
step_size = 100      # sliding-window step [samples]; in [1, window_size]
sample_rate = 0.2    # expected sampling frequency [Hz]; must agree with the file
psd = "model"        # whitening PSD; one of: "model" (RCL19 strain) | "ldc" (analytic TDI PSD) | "welch" (estimated) | "none"
observation_years = 1.0        # confusion fit of the "model" PSD; one of: 0.5 | 1.0 | 2.0 | 4.0
ldc_model = "sangria"          # noise levels of the "ldc" PSD; one of: "Proposal" | "SciRDv1" | "MRDv1" | "MRD_MFR" | "sangria" | "spritz"
ldc_tdi2 = false               # second-generation TDI factor of the "ldc" PSD
ldc_observation_years = 0.0    # confusion term of the "ldc" PSD [yr]; 0 disables, else in [0.25, 10]
welch_segment_length = 65536   # segment of the "welch" estimate [samples]; >= 2
feature_set = "whitened"       # per-window features; one of: "whitened" | "paper" | "bands"
low_band_hz = [0.001, 0.005]   # low analysis band [Hz]; ascending, > 0
high_band_hz = [0.005, 0.1]    # high analysis band [Hz]; ascending, > 0
band_edges_hz = [0.001, 0.005, 0.1]  # band edges of the "bands" feature set [Hz]; ascending, > 0, at least 2 (features: bands + 2)
highpass_cutoff_hz = 0.0005    # zero-phase record high-pass cutoff [Hz]; >= 0, 0 disables
highpass_order = 8             # Butterworth order of the record high-pass; >= 1
edge_margin = 0.0              # windows dropped at each record end, in window lengths; >= 0
output_prefix = "telemetry_complex"   # prefix of the output feature/label CSVs

[model]
n_qubits = 4    # VQC register size; >= 2, <= 24; must equal the feature dimension
n_layers = 4    # data re-uploading layers; >= 1

[training]
train_features = "data/inputs/telemetry_complex_features.csv"   # training feature CSV
train_labels = "data/inputs/telemetry_complex_labels.csv"       # training label CSV
epochs = 50                # maximum training epochs; >= 1
batch_size = 64            # mini-batch size; >= 1
learning_rate = 0.01       # initial Adam learning rate; > 0
lr_decay = 0.95            # multiplicative learning-rate decay per epoch; in (0, 1]
patience = 12              # early-stopping patience [epochs]; >= 1
train_fraction = 0.7       # chronological training block; in (0, 1)
validation_fraction = 0.15 # chronological validation block (early stopping, threshold); in (0, 1); the rest is the test block
class_weight = "balanced"  # positive-class loss weight; one of: "balanced" (negative/positive count ratio) | "none"
threshold_criterion = "far"  # criterion fitting the threshold on the calibration block; one of: "far" | "fpr" | "youden"
threshold_block = "held_out"  # calibration block of the threshold; one of: "validation" | "held_out" (validation and test pooled)
target_far_per_30d = 3.0   # false-alarm episodes per 30 mission days admitted by "far"; >= 0
target_fpr = 0.05          # window false-positive rate admitted by "fpr" and bounding the alarm duty cycle under "far"; in [0, 1]
scaler_quantiles = [0.005, 0.995]  # feature-scaler bounds as training-partition quantiles; ascending, in [0, 1]
test_mode_samples = 5000   # sample cap under --test-mode; >= 1
test_mode_epochs = 20      # epoch cap under --test-mode; >= 1
threaded = true            # batch gradients and forward passes over the Julia threads; one of: true | false
seed = 9999                # RNG seed for the data split and initialization

[inference]
features = "data/inputs/telemetry_complex_features.csv"   # inference feature CSV
labels = "data/inputs/telemetry_complex_labels.csv"       # inference label CSV; "" for blind mode
block = "all"        # rows evaluated when the features are the training table; one of: "all" | "validation" | "test"
step_size = 100      # window step [samples], used only without a feature sidecar; >= 1
sample_rate = 0.2    # sampling frequency [Hz], used only without a feature sidecar

[ldc]
h5_file = ""                    # LDC training product with truth stream and catalog (or pass --h5-file / --truth-csv)
truth_group = "sky/mbhb/tdi"    # compound dataset of the signal-only TDI
catalog_group = "sky/mbhb/cat"  # compound dataset of the source catalog
psd_model = "sangria"           # analytic TDI PSD of the labeling SNR; one of: "Proposal" | "SciRDv1" | "MRDv1" | "MRD_MFR" | "sangria" | "spritz"
tdi2 = false                    # second-generation TDI factor of the labeling PSD
observation_years = 0.0         # confusion term of the labeling PSD [yr]; 0 disables, else in [0.25, 10]
label_span = "fixed"            # positive span per merger; one of: "fixed" | "detectable"
label_before_sec = 345600.0     # fixed span before the merger [s]; >= 0
label_after_sec = 1620.0        # fixed span after the merger [s]; >= 0
label_snr_threshold = 5.0       # per-window SNR defining "detectable" and locating mergers without a catalog; > 0
label_window_size = 1000        # window of the labeling SNR scan [samples]; >= 2
label_step = 10                 # stride of the labeling SNR scan [samples]; >= 1
peak_min_separation_sec = 86400.0   # minimum separation of SNR peaks taken as distinct mergers [s]; >= 0
merger_snr_threshold = 8.0      # per-window SNR a peak must reach to count as a merger without a catalog; > 0
precursor_ratio = 0.1           # amplitude ratio below which an earlier SNR peak is merged into the later one; in [0, 1]
output_prefix = "ldc"           # prefix of the label, event, and span CSVs

[resources]
max_memory_gib = 16.0    # a stage whose pre-flight memory estimate exceeds this refuses to start [GiB]; > 0
warn_memory_gib = 8.0    # a stage whose estimate exceeds this warns [GiB]; <= max_memory_gib

[telemetry]
segment_duration_sec = 50.0     # producer segment length [s] of the exported scenario; > 0
batch_size = 10                 # producer segments per batch; >= 1
start_sim_time = "2035-01-01T00:00:00"   # mission epoch of the exported payload; ISO-8601
output_prefix = "telemetry"     # prefix of the payload CSV and scenario fragment
run_dir = ""                    # DeepSpaceTelemetry run directory; "" requires --run-dir
mode = "replay"                 # arrival feed handling; one of: "replay" | "live"
min_coverage = 1.0              # fraction of a window's samples on the ground before scoring; in (0, 1]
tdi_gap_dilation_sec = 100.0    # erosion on each side of a lost or pruned batch [s]; >= 0
context_windows = 4             # window lengths of delivered context on each side used for whitening; >= 0
psd_sidecar = ""                # feature sidecar supplying the whitening PSD of the record being scored; "" uses the training run's
poll_interval_sec = 1.0         # live-mode polling period of the arrival feed [s]; > 0
producer_compat = "1.0"         # accepted DeepSpaceTelemetry version lower bound (semver)
processing_latency_hours = 1.0  # ground processing budget added to every alert latency [h]; >= 0
events_csv = ""                 # event table (merger_time_s, label spans) for the alert-latency table; "" disables
