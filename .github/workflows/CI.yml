# The repository is private, so the workflow runs against the free-tier
# Actions allowance: the triggers are the default branch, pull requests
# into it, version tags, and manual dispatch. The documentation job builds
# but does not deploy — Pages for a private repository needs a paid plan —
# and the coverage upload is a no-op until CODECOV_TOKEN is set, which it
# tolerates. The package is not registered in General, so there is no
# TagBot and no registration workflow: release tags are created by hand.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests — Julia ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # "1" is the blocking job on the current stable release (1.13, the
    # version the committed Manifests are resolved on) and "1.12" on the
    # compat floor. Coverage runs once: it disables package images and
    # roughly doubles the precompile time.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1"
            os: ubuntu-latest
            coverage: true
            experimental: false
          - version: "1.12"
            os: ubuntu-latest
            coverage: false
            experimental: false
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      # The committed manifests are resolved on the current release. A leg
      # on another version discards them and resolves its own environment,
      # because standard-library membership moves between versions; that
      # leg verifies the compat bounds, the blocking leg the manifests as
      # committed.
      - name: Discard the committed manifests off the resolution version
        if: matrix.version != '1'
        run: rm -f Manifest.toml test/Manifest.toml docs/Manifest.toml
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - run: |
          julia -e 'using Pkg; Pkg.add("JuliaFormatter"); using JuliaFormatter;
                    format(".", verbose = false) || error("Formatting check failed: run JuliaFormatter over the repository.")'
  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - run: julia docs/make.jl
