# Continuous integration is deferred until the repository becomes public:
# GitHub Actions minutes are not available on this private repository, so
# the workflow runs on manual dispatch only. Re-enable the push and
# pull-request triggers at publication, together with the coverage upload
# (CODECOV_TOKEN), the documentation deployment, and TagBot.
name: CI
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests — Julia ${{ matrix.version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # "1" is the blocking job on the current stable release (1.13, the
    # version the committed Manifests are resolved on) and "1.12" on the
    # compat floor. Coverage runs once: it disables package images and
    # roughly doubles the precompile time.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1"
            os: ubuntu-latest
            coverage: true
            experimental: false
          - version: "1.12"
            os: ubuntu-latest
            coverage: false
            experimental: false
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - run: |
          julia -e 'using Pkg; Pkg.add("JuliaFormatter"); using JuliaFormatter;
                    format(".", verbose = false) || error("Formatting check failed: run JuliaFormatter over the repository.")'
  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - run: julia docs/make.jl
